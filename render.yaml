# Render blueprint for the AutoJMS license server.
#
# WHY THIS FILE IS AT THE REPOSITORY ROOT
# ---------------------------------------
# Render discovers a Blueprint only as `render.yaml` at the ROOT of the connected
# repository. There is no setting for an alternate blueprint path. The copy that
# used to live at `backend/render.yaml` was therefore never read by Render — it
# described a deployment that could not happen. `rootDir` below is what makes this
# a monorepo blueprint: Render clones the whole repo and then builds and runs
# inside `backend/render-license-server/`.
#
# DEPLOY SOURCE — decided 2026-08-26 (owner decision L-1, option A1)
# -----------------------------------------------------------------
# The Render Web Service points at the monorepo `Datt03-sss/AutoJMS`, path
# `backend/render-license-server/`. It no longer serves `Datt03-sss/AutoJMS-API`.
# One source of truth: the code here has the DataHub assertion issuer, the `seats`
# and `tokenVersion` fields, the day-16 expiry lifecycle, an authenticated
# /api/logout, SIGTERM graceful shutdown, 123 tests — and no Supabase.
#
# CUTOVER EXECUTED — verified 2026-08-27
# ---------------------------------------
# `GET /api/version` on production returns commit 94769b17fec1, a commit that
# exists only in this monorepo (it is the one that added the Dockerfile below), and
# `node: v22.23.2`, which matches the `node:22-alpine` base image. Production is
# therefore genuinely serving this directory now, on Render's Docker runtime.
#
# What that does NOT prove, because /health is a static literal that touches
# nothing (server.js:618) and /api/version has a test asserting it never reads the
# database: only three of the six `sync: false` entries are hard boot gates -
# JWT_PRIVATE_KEY + JWT_PUBLIC_KEY (server.js:53 exits 1) and the Firebase service
# account (server.js:252 exits 1). The other three fail SILENTLY while the service
# still answers 200, and each had to be confirmed separately.
#
# RS256 ASSERTION PATH — reported configured 2026-08-27 (VPS operator)
# --------------------------------------------------------------------
# DATAHUB_LICENSE_ASSERTION_PRIVATE_KEY (RSA 2048 PKCS#8) and
# DATAHUB_API_BASE_URL=https://dev.jmsauto.online were injected on Render, the VPS
# was given the matching PUBLIC half, and DATAHUB_ALLOW_STAGING_TEST_ISSUER was set
# to false so RsaLicenseAssertionValidator is the validator in use. An assertion
# minted with that private key was accepted at POST /api/v1/devices/enroll with 201
# Created.
#
# Read precisely, that proves the KEY PAIR and the VPS-side claim checks agree. It
# is not the same as proving this service emits an assertion:
#   * The disappearance of `[datahub] ... enrollment stays closed` proves only that
#     formatKey(env) is non-empty (server.js:168-178). formatKey strips wrapping
#     quotes and un-escapes \n (server.js:58-61) - it does not parse the key. A
#     malformed key first fails at crypto.sign (server.js:236), i.e. on a real
#     request, not at boot.
#   * Even with a valid key, buildDataHubAssertion returns null and the response
#     carries NO `datahub` block when the license has no usable site code
#     (server.js:215-216) - placeholders like "0000" are dropped on purpose. That
#     path is silent at 200 as well.
#   * VALID_EXE_HASHES is still unconfirmed. Empty means the whole hash check is
#     skipped (server.js:895) with no log line at all - the anti-tamper gate turns
#     itself off quietly.
# So the only proof of a complete cutover remains POST /api/verify-license with a
# real key returning a `datahub` block containing an `assertion`.
#
# !! BLUEPRINT vs LIVE CONFLICT — READ BEFORE APPLYING !!
# The live service now runs the STAGING triple: DATAHUB_CHANNEL=staging,
# ISSUER=autojms-license-staging, AUDIENCE=autojms-datahub-enroll-staging. The three
# matching entries in the envVars list below are literal `value:` entries carrying
# the PRODUCTION strings. A blueprint sync overwrites literals, which is the exact
# fault already documented for DATAHUB_API_BASE_URL further down. server.js:170-172
# reads all three straight from env into the assertion payload, and the VPS compares
# them with ORDINAL equality - issuer/audience at
# src/AutoJMS.DataHub.Api/Auth/LicenseAssertionPayload.cs:36-38 and channel at :49-50.
# Applying this file unchanged therefore turns the 201 above into
# LICENSE_ASSERTION_INVALID on every enrollment. Either flip the VPS to the
# production triple first, or change these three to `sync: false` before applying.
services:
  - type: web
    name: autojms-api
    # Docker, not the native Node runtime: the existing Free-tier service in
    # Singapore was already set to Docker, and reusing it is what avoids the credit
    # card that a newly created Blueprint service demands. The Dockerfile owns the
    # build and the start command, so buildCommand/startCommand are gone - they are
    # not merely redundant under this runtime, they are invalid.
    runtime: docker
    rootDir: backend/render-license-server
    # WARNING - Render's own documentation contradicts itself on these two fields:
    #   * /docs/blueprint-spec says dockerfilePath and dockerContext are "relative
    #     to the repo root".
    #   * /docs/monorepo-support says that when a root directory is set you must
    #     "update values for the following fields as needed to be relative to the
    #     new root directory: buildCommand, startCommand, preDeployCommand,
    #     dockerfilePath, dockerContext, staticPublishPath".
    # The values below follow the monorepo page, because it is the one that
    # addresses this exact combination, and because the alternative reading makes
    # `dockerContext: .` mean the repo root - which would break `COPY package*.json
    # ./` (there is no package.json at the repo root) and ship the entire WinForms
    # app as build context.
    #
    # BEFORE APPLYING THIS BLUEPRINT: read the service's "Dockerfile Path" field in
    # the dashboard and make these two lines agree with it. The service is LIVE; a
    # wrong path here turns a blueprint sync into an outage. The live build does not
    # settle the question on its own - it is consistent with either reading.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Omitting `plan` is documented as "Render uses `starter` for a new service.
    # Render retains the current instance type for an existing service." Retaining
    # is fine today, but `starter` is a PAID plan, and avoiding a credit card is the
    # entire reason this service is being reused instead of recreated. Stating
    # `free` means a future recreate cannot silently land on a paid instance type.
    plan: free
    # Dependency-free and deliberately un-rate-limited (server.js:618), unlike
    # /api/version which sits behind healthLimiter. Render probes this often enough
    # that pointing it at a rate-limited variant would spend the limiter budget on
    # the platform's own polling.
    healthCheckPath: /health
    # `true` records what the live service actually does: the Docker deploy of
    # commit 94769b1 was triggered by the push, not by hand. This SUPERSEDES item
    # A1-g of docs/agent/BACKEND_BUILD_AND_VPS_DEPLOY_PLAN.vi.md, which asked for
    # `false` until Chặng F - that item is no longer the state of the world, and a
    # blueprint that lied about it would be worse than one that disagrees with a
    # plan. What makes `true` tolerable is the buildFilter below: only commits that
    # touch backend/render-license-server/** can reach production. Without that
    # filter, `true` would mean every WinForms commit redeploys the license server.
    autoDeploy: true
    # NOT a capacity setting — a correctness one. The JTI replay cache
    # (NodeCache, server.js:290) and every express-rate-limit store are
    # in-memory and per-process. A second instance is a second, independent
    # replay window and a second, independent rate-limit budget: scaling out
    # multiplies the limits an attacker has to beat rather than the load the
    # service can take. Fix the state first, scale second.
    numInstances: 1
    # Monorepo hygiene, and now load-bearing rather than precautionary: autoDeploy
    # is on, so this filter is the only thing stopping a WinForms commit from
    # redeploying the license server. rootDir scopes the build, not the deploy
    # trigger. Paths are written from the REPO ROOT, not from rootDir - a filter of
    # `**` here would match nothing.
    buildFilter:
      paths:
        - backend/render-license-server/**
    envVars:
      - key: NODE_ENV
        value: production
      # INERT under the Docker runtime - NODE_VERSION only steers Render's native
      # Node build. The real pin is now `FROM node:22-alpine` in the Dockerfile
      # (production reports v22.23.2). Kept so that a revert to the native runtime
      # does not silently lose the pin; package.json requires >=20.
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_OPERATION_TIMEOUT_MS
        value: "8000"
      - key: FIREBASE_DATABASE_URL
        value: https://keyauthjms-default-rtdb.asia-southeast1.firebasedatabase.app/
      - key: DEFAULT_UPDATE_CHANNEL
        value: stable

      # ---- Secrets, set in the dashboard -----------------------------------
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # One Firebase credential source is enough; the server also accepts
      # FIREBASE_SERVICE_ACCOUNT_JSON, FIREBASE_SERVICE_ACCOUNT_FILE (a Secret
      # File) and GOOGLE_APPLICATION_CREDENTIALS, in that order of preference.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: VALID_EXE_HASHES
        sync: false

      # ---- DataHub device enrollment ---------------------------------------
      # `sync: false`, not a placeholder value. A blueprint that carries
      # `https://datahub.example.com` does not merely document a gap — every
      # blueprint sync WRITES it back over whatever real hostname the owner set
      # in the dashboard, and the server hands that dead domain to every station
      # inside the `datahub` block with a 200 and no error. The station then
      # configures DataHubClient with a real device token pointed at a host that
      # does not resolve. Leaving the value unset instead makes Render ask for it
      # at blueprint apply time, and it differs per environment anyway (G10).
      # Set on the live service to https://dev.jmsauto.online as of 2026-08-27;
      # `sync: false` is what keeps this file from overwriting it.
      - key: DATAHUB_API_BASE_URL
        sync: false
      # The RSA PRIVATE half of the license-assertion pair. The VPS holds only the
      # public half. Without this the server issues no assertion, every
      # /api/v1/devices/enroll is refused, and ULTRA stations lose runtime policy,
      # updates and sync — while verify-license still returns 200, so the failure
      # is silent from the client's point of view.
      # Injected on the live service 2026-08-27 (RSA 2048 PKCS#8); the startup
      # warning at server.js:177 is gone and an assertion signed with this key was
      # accepted by the VPS with 201. See the RS256 block in the file header for what
      # that does and does not prove.
      - key: DATAHUB_LICENSE_ASSERTION_PRIVATE_KEY
        sync: false
      # These MUST equal DATAHUB_LICENSE_ASSERTION_ISSUER / _AUDIENCE on the VPS.
      # server.js falls back to the unsuffixed "autojms-license" /
      # "autojms-datahub-enroll", which do NOT match
      # backend/datahub/env.production.template — leaving them unset therefore
      # fails validation on every enrollment. The values below are verified equal
      # to that template as of 2026-08-26, which is what closes risk G3 for the
      # production channel.
      #
      # STALE AS OF 2026-08-27, AND NOT SAFE TO APPLY. The live service and the VPS
      # were both moved to the STAGING triple to prove the RS256 handshake, and that
      # handshake now returns 201. These two literals are the PRODUCTION strings, so
      # a blueprint sync writes them over the working staging pair and every
      # enrollment starts failing LICENSE_ASSERTION_INVALID — the comparison is
      # ordinal, at LicenseAssertionPayload.cs:36-38. They are deliberately left as
      # literals rather than switched to `sync: false` here: which channel
      # production should settle on is an owner decision, not a cleanup. Decide the
      # channel first, then either update these values or make them `sync: false`.
      - key: DATAHUB_LICENSE_ASSERTION_ISSUER
        value: autojms-license-production
      - key: DATAHUB_LICENSE_ASSERTION_AUDIENCE
        value: autojms-datahub-enroll-production
      - key: DATAHUB_LICENSE_ASSERTION_TTL_SECONDS
        value: "300"
      # Must equal DATAHUB_CHANNEL on the VPS, or the assertion is rejected
      # (LicenseAssertionPayload.cs:49-50 -> CHANNEL_MISMATCH). Same staleness as the
      # issuer/audience pair above: the live service is on `staging` as of 2026-08-27.
      - key: DATAHUB_CHANNEL
        value: production
      - key: DATAHUB_DEFAULT_SEATS
        value: "3"

      # ---- Google Sheets token broker --------------------------------------
      # Upload the service account as a Render Secret File and point this at the
      # mount path. A Secret File often has no .json extension, which is why the
      # server reads and parses it rather than require()-ing it.
      - key: GOOGLE_SHEETS_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/googleSheetsServiceAccount.json
      - key: GOOGLE_SHEETS_GRANT_TIMEOUT_MS
        value: "8000"

      # ---- License lifecycle ------------------------------------------------
      # A license is sold monthly but always expires at 00:00 Asia/Ho_Chi_Minh on
      # the anchor day, so the whole fleet renews on one calendar date.
      - key: LICENSE_BILLING_ANCHOR_DAY
        value: "16"
      - key: LICENSE_GRACE_DAYS
        value: "7"
      - key: LICENSE_OFFLINE_GRACE_HOURS
        value: "72"
      # Keep at 0 until every key's middleCode has been backfilled with a real
      # site code. Turning it on early locks out the entire fleet.
      - key: REQUIRE_UNIQUE_SITE_CODE
        value: "0"

# ---- A deliberate omission: `region` -----------------------------------------
# Not set here, and that is a decision rather than an oversight.
#
# Render's default region is Oregon. The service's hot path is Firebase RTDB in
# `asia-southeast1` (Singapore): verify-license alone does a license read, a
# session write and a stale-session sweep, so the region gap is paid several
# times on every app launch. Oregon→Singapore is roughly 170–200 ms round trip;
# Singapore→Singapore is single-digit to low-tens of ms.
#
# It is omitted rather than set to `singapore` because a service's region CANNOT
# be changed after creation. Option A1 re-points the EXISTING service, so its
# region is already fixed and declaring a different one here would only produce a
# conflict at apply time. If the owner ever recreates the service (option A3, or
# a rebuild for any other reason), add `region: singapore` at that moment — it is
# the single largest latency win available to this service and it is only
# available on day one.
