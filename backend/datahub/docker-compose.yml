name: autojms-datahub

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DATAHUB_PUBLIC_HOST: ${DATAHUB_PUBLIC_HOST:?set DATAHUB_PUBLIC_HOST}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:?set TLS_CONTACT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: ${DATAHUB_API_IMAGE:?set DATAHUB_API_IMAGE to an immutable @sha256 image reference}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?set ASPNETCORE_ENVIRONMENT}
      DATAHUB_CHANNEL: ${DATAHUB_CHANNEL:?set DATAHUB_CHANNEL}
      # Same value Caddy uses above. The API needs it only to build the absolute `type`
      # URI of problem responses, which used to be a hardcoded example.com literal.
      # Optional on purpose: unset, the API emits relative /problems/... references, so a
      # missing value degrades the error body's cosmetics and nothing else.
      DATAHUB_PUBLIC_HOST: ${DATAHUB_PUBLIC_HOST:-}
      DATAHUB_DB_MAX_POOL_SIZE: ${DATAHUB_DB_MAX_POOL_SIZE:-20}
      DATAHUB_RETENTION_INTERVAL_SECONDS: ${DATAHUB_RETENTION_INTERVAL_SECONDS:-900}
      DATAHUB_RETENTION_BATCH_SIZE: ${DATAHUB_RETENTION_BATCH_SIZE:-1000}
      DATAHUB_DEVICE_TOKEN_ISSUER: ${DATAHUB_DEVICE_TOKEN_ISSUER:?set DATAHUB_DEVICE_TOKEN_ISSUER}
      DATAHUB_DEVICE_TOKEN_AUDIENCE: ${DATAHUB_DEVICE_TOKEN_AUDIENCE:?set DATAHUB_DEVICE_TOKEN_AUDIENCE}
      DATAHUB_DEVICE_TOKEN_SIGNING_KEY: ${DATAHUB_DEVICE_TOKEN_SIGNING_KEY:?set DATAHUB_DEVICE_TOKEN_SIGNING_KEY}
      # Device bearer lifetime. Clamped to 300..2592000 seconds by DataHubRuntimeOptions,
      # so a typo shortens or lengthens the window but can never disable expiry.
      DATAHUB_DEVICE_TOKEN_LIFETIME_SECONDS: ${DATAHUB_DEVICE_TOKEN_LIFETIME_SECONDS:-86400}
      DATAHUB_ENROLLMENT_PEPPER: ${DATAHUB_ENROLLMENT_PEPPER:?set DATAHUB_ENROLLMENT_PEPPER}
      DATAHUB_LICENSE_ASSERTION_ISSUER: ${DATAHUB_LICENSE_ASSERTION_ISSUER:?set DATAHUB_LICENSE_ASSERTION_ISSUER}
      DATAHUB_LICENSE_ASSERTION_AUDIENCE: ${DATAHUB_LICENSE_ASSERTION_AUDIENCE:?set DATAHUB_LICENSE_ASSERTION_AUDIENCE}
      # Production enrollment needs the license issuer's RSA PUBLIC key through one of
      # these two. Neither was passed through before, so a production host could never
      # validate a real assertion no matter what was in .env.
      DATAHUB_LICENSE_ASSERTION_PUBLIC_KEY: ${DATAHUB_LICENSE_ASSERTION_PUBLIC_KEY:-}
      DATAHUB_LICENSE_ASSERTION_PUBLIC_KEY_PATH: ${DATAHUB_LICENSE_ASSERTION_PUBLIC_KEY_PATH:-}
      DATAHUB_STAGING_TEST_SIGNING_KEY: ${DATAHUB_STAGING_TEST_SIGNING_KEY:-}
      DATAHUB_ALLOW_STAGING_TEST_ISSUER: ${DATAHUB_ALLOW_STAGING_TEST_ISSUER:-false}
      DATAHUB_TRUSTED_PROXY_NETWORKS: ${DATAHUB_TRUSTED_PROXY_NETWORKS:-}
      # Operator token for PUT /api/v1/admin/manifests/**. Required at deploy time on
      # purpose: without it release/build-release.ps1 gets a 503 on every publish and
      # the fleet silently never receives a policy or an update.
      DATAHUB_ADMIN_TOKEN: ${DATAHUB_ADMIN_TOKEN:?set DATAHUB_ADMIN_TOKEN}
      DATAHUB_MANIFEST_ROOT: ${DATAHUB_MANIFEST_ROOT:-/manifests}
      ConnectionStrings__DataHub: Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB};Username=${POSTGRES_USER:?set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD};Pooling=true;Maximum Pool Size=${DATAHUB_DB_MAX_POOL_SIZE:-20};Timeout=5;Command Timeout=30
    volumes:
      # Published manifests and configs must outlive the container: they are written
      # once per release and read by every station on every start.
      - manifests_data:/manifests
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Every number below is derived from `mem_limit: 2g` on this service, so they are
    # ONE setting in five lines: raising shared_buffers without raising mem_limit gets
    # the container OOM-killed, and raising mem_limit without these leaves the extra
    # memory unused. Change them together or not at all. They are deliberately not
    # ${VARIABLE}s for the same reason — an .env that can move one of them
    # independently is an .env that can put the cluster past its own limit.
    #
    # Applying these restarts the container: `shared_buffers` is a postmaster-start
    # parameter, not reloadable. Plan it as brief downtime.
    #
    # max_connections is left at its default 100 on purpose. Lowering it to match the
    # API pool would bound work_mem's worst case on paper, but it would hard-code a
    # ceiling that DATAHUB_DB_MAX_POOL_SIZE can be raised past from .env alone — the
    # API would then exhaust the server it was configured to fit inside.
    command:
      - postgres
      # 25% of mem_limit, the standard starting point. The default is 128MB, which on
      # a 2GB container leaves ~1.8GB doing nothing for the database it was reserved
      # for. This does NOT need shm_size raised: since 9.3 the main shared memory
      # segment is mmap'd anonymous shared memory, not POSIX /dev/shm. shm_size: 256m
      # below serves dynamic shared memory for parallel workers, which is a separate
      # and much smaller budget.
      - -c
      - shared_buffers=512MB
      # What the planner believes is cached, shared_buffers plus OS page cache. The
      # default is 4GB — on a 2GB container that is a planner told it has twice the
      # cache the machine can hold, which biases it toward index scans that then miss.
      - -c
      - effective_cache_size=1536MB
      # Per sort/hash NODE per connection, not per connection — a query with three
      # such nodes takes three of these. The worst case is bounded by the only client:
      # ConnectionStrings__DataHub above caps the API pool at DATAHUB_DB_MAX_POOL_SIZE
      # (20), so ~20 concurrent queries, not max_connections. The default 4MB spills
      # the change-feed and snapshot sorts to disk on a VPS whose disk is the slowest
      # thing it owns.
      - -c
      - work_mem=16MB
      # CREATE INDEX / REINDEX / manual VACUUM, run one at a time in a migration
      # window. autovacuum_work_mem is pinned separately BECAUSE it defaults to this
      # value: left alone, 128MB here silently becomes 3 x 128MB of background
      # autovacuum (autovacuum_max_workers = 3) competing with live queries for the
      # same 2GB.
      - -c
      - maintenance_work_mem=128MB
      - -c
      - autovacuum_work_mem=64MB
      # These two assume SSD/NVMe-backed storage, which is the one assumption here
      # that is about the host rather than about mem_limit. random_page_cost=4.0 is a
      # spinning-disk number: it makes the planner prefer a sequential scan over the
      # indexes migration 006 exists to provide. On spinning disk, revert both.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 1.5
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  manifests_data:

networks:
  edge:
  data:
    internal: true
