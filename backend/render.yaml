# MOVED — this file is not a Render blueprint any more.
#
# The blueprint now lives at the repository root:  ../render.yaml
#
# Render discovers a Blueprint only as `render.yaml` at the ROOT of the connected
# repository; there is no setting for an alternate path. So for as long as the
# blueprint sat here it was never read by Render, and the "the live service is not
# deployed from this blueprint" note it carried was partly self-inflicted: even a
# correctly configured Render service could not have found it.
#
# Kept as a signpost rather than removed, because the old path is referenced from
# BACKEND_DEPLOY_STATUS.md and from earlier audit reports, and an empty 404 there
# would send the next reader looking for a second, hidden blueprint.
#
# Everything that used to be here — rootDir, buildCommand, the env var inventory,
# the issuer/audience pair that must match backend/datahub/env.production.template
# — is in the root file, unchanged except for the fixes recorded in its header.
#
# Cutover runbook: docs/agent/BACKEND_BUILD_AND_VPS_DEPLOY_PLAN.vi.md, Chặng A.
